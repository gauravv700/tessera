# Full stack: docker compose up --build
# UI  -> http://localhost:3000      API/WS (via nginx LB, 2 API replicas) -> http://localhost:8080
x-backend-env: &backend-env
  NODE_ENV: development
  DATABASE_URL: postgres://trading:trading@timescale:5432/trading
  REDIS_URL: redis://redis:6379
  MONGO_URL: mongodb://mongo:27017/trading
  KAFKA_BROKERS: kafka:9092
  AI_SERVICE_URL: http://ai:8000
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
  CORS_ORIGIN: http://localhost:3000
  LOG_LEVEL: info

services:
  timescale:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "5432:5432"
    environment:
      {
        POSTGRES_USER: trading,
        POSTGRES_PASSWORD: trading,
        POSTGRES_DB: trading,
      }
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      {
        test: ["CMD-SHELL", "pg_isready -U trading -d trading"],
        interval: 5s,
        timeout: 3s,
        retries: 20,
      }

  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      { POSTGRES_USER: vec, POSTGRES_PASSWORD: vec, POSTGRES_DB: vec }
    volumes: [vec-data:/var/lib/postgresql/data]
    healthcheck:
      {
        test: ["CMD-SHELL", "pg_isready -U vec -d vec"],
        interval: 5s,
        timeout: 3s,
        retries: 20,
      }

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      {
        test: ["CMD", "redis-cli", "ping"],
        interval: 5s,
        timeout: 3s,
        retries: 20,
      }

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  # kafka:
  #   image: apache/kafka:3.8.0 # single-node KRaft (no ZooKeeper)
  #   ports: ["9092:9092"]
  #   environment:
  #     KAFKA_NODE_ID: 1
  #     KAFKA_PROCESS_ROLES: broker,controller
  #     KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  #     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
  #     KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  #     KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  #     KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
  #     KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  #     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  #     KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
  #     KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  #     KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  #   volumes: [kafka-data:/var/lib/kafka/data]

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    ports:
      - "29092:29092"

    volumes: [kafka-data:/var/lib/kafka/data]

  ai:
    build: ./ai-service
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://vec:vec@pgvector:5432/vec
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    depends_on: { pgvector: { condition: service_healthy } }
    restart: unless-stopped

  # Stateless, horizontally scalable: REST + WebSocket. Any replica can serve any client (Redis adapter).
  api:
    build: ./backend
    environment: { <<: *backend-env, ROLES: api, LOAD_TEST: "true" }
    deploy: { replicas: 2 }
    depends_on: &deps
      timescale: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_started }
      mongo: { condition: service_started }
    restart: unless-stopped

  # Single-writer roles: the matching engine keeps the book in memory, so run exactly one replica per shard.
  worker:
    build: ./backend
    environment:
      {
        <<: *backend-env,
        ROLES: "matching,settlement,notifications,marketdata,bot",
        BOT_ENABLED: "true",
      }
    depends_on: *deps
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    volumes: ["./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8080:8080"]
    depends_on: [api]

  frontend:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: http://localhost:8080 }
    ports: ["3000:3000"]
    depends_on: [gateway]

  # optional local LLM:  docker compose --profile llm up  (then: docker compose exec ollama ollama pull llama3.2)
  ollama:
    image: ollama/ollama
    profiles: [llm]
    volumes: [ollama:/root/.ollama]

volumes:
  {
    pg-data: {},
    vec-data: {},
    redis-data: {},
    mongo-data: {},
    kafka-data: {},
    ollama: {},
  }
