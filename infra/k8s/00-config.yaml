apiVersion: v1
kind: Namespace
metadata: { name: trading }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: trading-config, namespace: trading }
data:
  # Point these at managed services in production (RDS/Timescale Cloud, ElastiCache, MSK, DocumentDB/Atlas).
  DATABASE_URL: "postgres://trading:CHANGE_ME@timescale.trading.svc:5432/trading"
  REDIS_URL: "redis://redis.trading.svc:6379"
  MONGO_URL: "mongodb://mongo.trading.svc:27017/trading"
  KAFKA_BROKERS: "kafka.trading.svc:9092"
  AI_SERVICE_URL: "http://ai.trading.svc:8000"
  CORS_ORIGIN: "https://trading.example.com"
  DB_SYNC: "false"          # use real migrations in production
  NODE_ENV: "production"
---
apiVersion: v1
kind: Secret
metadata: { name: trading-secrets, namespace: trading }
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_WITH_A_LONG_RANDOM_VALUE"   # create with: kubectl create secret ... or use External Secrets / Vault
  ANTHROPIC_API_KEY: ""
