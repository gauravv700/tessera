# docker compose -f docker-compose.yml -f docker-compose.observability.yml up --build
# Grafana http://localhost:3001 (admin/admin) · Prometheus :9090 · Jaeger :16686
services:
  api:    { environment: { OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318", OTEL_SERVICE_NAME: trading-api } }
  worker: { environment: { OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318", OTEL_SERVICE_NAME: trading-worker } }

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    environment: { GF_SECURITY_ADMIN_PASSWORD: admin }
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus, loki]

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["16686:16686"]

  loki:
    image: grafana/loki:3.1.1
    command: -config.file=/etc/loki/local-config.yaml

  promtail:   # ships every container's JSON logs (pino) to Loki
    image: grafana/promtail:3.1.1
    volumes:
      - ./infra/loki/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on: [loki]
