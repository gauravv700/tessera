# Stateless API + WebSocket tier: scale freely (Redis adapter fans events out across pods).
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: trading, labels: { app: api } }
spec:
  replicas: 3
  selector: { matchLabels: { app: api } }
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata:
      labels: { app: api }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "4000", prometheus.io/path: /metrics }
    spec:
      containers:
        - name: api
          image: ghcr.io/YOUR_ORG/trading-backend:latest
          ports: [{ containerPort: 4000 }]
          env: [{ name: ROLES, value: api }]
          envFrom: [{ configMapRef: { name: trading-config } }, { secretRef: { name: trading-secrets } }]
          readinessProbe: { httpGet: { path: /health, port: 4000 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 4000 }, initialDelaySeconds: 20, periodSeconds: 10 }
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: trading }
spec: { selector: { app: api }, ports: [{ port: 4000, targetPort: 4000 }] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api, namespace: trading }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 3
  maxReplicas: 20
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: api, namespace: trading }
spec: { minAvailable: 2, selector: { matchLabels: { app: api } } }
