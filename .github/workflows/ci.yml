name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package.json }
      - run: npm install
      - run: npm run build
      - run: npm test
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package.json }
      - run: npm install
      - run: npm run build
  ai-service:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ai-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pytest -q
  images:
    needs: [backend, frontend, ai-service]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with: { context: backend, push: true, tags: "ghcr.io/${{ github.repository_owner }}/trading-backend:${{ github.sha }}" }
      - uses: docker/build-push-action@v6
        with: { context: ai-service, push: true, tags: "ghcr.io/${{ github.repository_owner }}/trading-ai:${{ github.sha }}" }
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }}
          tags: "ghcr.io/${{ github.repository_owner }}/trading-frontend:${{ github.sha }}"
  # Deploy step intentionally left as a stub: add `kubectl set image` / Argo CD sync for your cluster.
